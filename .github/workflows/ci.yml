name: CI

# Build + test the C++ and Python suites:
#   ctest        -- C++ suite on Linux and macOS (ONNX backend off)
#   tsan         -- the suite under ThreadSanitizer, gating the ADR-11
#                   single-writer / concurrent-reader model
#   pytest       -- the Python bindings + CLI suite against an editable install
#
# Runs on pushes to main (and tags) and on every pull request. Feature
# branches get CI through their PR, so a branch with an open PR is not
# built twice.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request: {}

permissions:
  contents: read

jobs:
  ctest:
    name: ctest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Configure
        run: cmake -B build -DRETRIEVAL_ENGINE_WITH_ONNX=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  tsan:
    name: ctest + ThreadSanitizer (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Configure
        run: cmake -B build-tsan -DRETRIEVAL_ENGINE_WITH_ONNX=OFF -DRETRIEVAL_ENGINE_SANITIZE=thread
      - name: Build
        run: cmake --build build-tsan --parallel
      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure
      - name: Concurrency suite, repeated
        run: ctest --test-dir build-tsan -R Concurrency --output-on-failure --repeat until-fail:10

  pytest:
    name: pytest (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable) + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Test
        run: python -m pytest
