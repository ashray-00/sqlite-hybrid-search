[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "sqlite-hybrid-search"
version = "0.1.0"
description = "Ultra-fast, in-process hybrid search & agent memory engine in C++17 with Python bindings."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ashray Adhikari", email = "adhikariashray@gmail.com" }]
keywords = [
    "retrieval",
    "rag",
    "vector-search",
    "hybrid-search",
    "bm25",
    "reciprocal-rank-fusion",
    "agent-memory",
    "embeddings",
    "sqlite",
    "usearch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

# Fill in the real repository URL before publishing to PyPI.
# [project.urls]
# Homepage = "https://github.com/OWNER/sqlite-hybrid-search"
# Repository = "https://github.com/OWNER/sqlite-hybrid-search"
# Documentation = "https://github.com/OWNER/sqlite-hybrid-search/blob/main/README.md"

[project.scripts]
hybrid-search = "sqlite_hybrid_search.cli:main"

[tool.scikit-build]
wheel.packages = ["python/sqlite_hybrid_search"]

# The wheel already carries only the compiled extension + the Python
# package. Trim dev-only scaffold from the source distribution too -- it
# still has everything needed to build (core/, bindings/, python/, cmake/,
# CMakeLists.txt, LICENSE, README.md, docs/DECISIONS.md, the test suites).
sdist.exclude = [
    "CLAUDE.md",
    "BUILD_PLAN.md",
    "docs/dev-log.md",
    "benchmarks/results.json",
    ".clang-format",
    ".gitignore",
]

[tool.scikit-build.cmake.define]
# Skip fetching/building GoogleTest and the C++ test executables for a
# Python packaging build -- pip install shouldn't need them.
RETRIEVAL_ENGINE_BUILD_TESTS = "OFF"
RETRIEVAL_ENGINE_BUILD_BENCHMARKS = "OFF"
RETRIEVAL_ENGINE_BUILD_PYTHON_BINDINGS = "ON"
# Adds the Homebrew prefix to CMake's search path so a `pip install` on
# macOS finds the keg-only SQLite the same way the documented C++ build
# does. On Linux the path simply does not exist and is ignored -- the
# system SQLite in /usr is found without it.
CMAKE_PREFIX_PATH = "/opt/homebrew"

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["SIM117", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"benchmarks/test_eval.py" = ["E501"]
