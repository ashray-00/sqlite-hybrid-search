[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "retrieval-engine"
version = "0.1.0"
description = "Ultra-fast, in-process hybrid search & agent memory engine in C++17 with Python bindings."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ashray Adhikari", email = "adhikariashray@gmail.com" }]
keywords = [
    "retrieval",
    "rag",
    "vector-search",
    "hybrid-search",
    "bm25",
    "reciprocal-rank-fusion",
    "agent-memory",
    "embeddings",
    "sqlite",
    "usearch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]

# Fill in the real repository URL before publishing to PyPI.
# [project.urls]
# Homepage = "https://github.com/OWNER/retrieval-engine"
# Repository = "https://github.com/OWNER/retrieval-engine"
# Documentation = "https://github.com/OWNER/retrieval-engine/blob/main/README.md"

[project.scripts]
engine = "retrieval_engine.cli:main"

[tool.scikit-build]
wheel.packages = ["python/retrieval_engine"]

[tool.scikit-build.cmake.define]
# Skip fetching/building GoogleTest and the C++ test executables for a
# Python packaging build -- pip install shouldn't need them.
RETRIEVAL_ENGINE_BUILD_TESTS = "OFF"
RETRIEVAL_ENGINE_BUILD_BENCHMARKS = "OFF"
RETRIEVAL_ENGINE_BUILD_PYTHON_BINDINGS = "ON"
# Same Homebrew ARM64 path CLAUDE.md's documented C++ build command passes
# (`cmake -B build -DCMAKE_PREFIX_PATH=/opt/homebrew`), so SQLite3/usearch
# resolve identically whether building via CMake directly or via `pip
# install`.
CMAKE_PREFIX_PATH = "/opt/homebrew"

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["SIM117", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"benchmarks/test_eval.py" = ["E501"]
